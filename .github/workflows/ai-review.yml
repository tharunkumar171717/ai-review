name: AI PR Review

# SECURITY: pull_request_target runs the workflow and reviewer from the BASE branch (trusted),
# with access to secrets. This job must never check out or run code from the PR: the reviewer
# reads the PR's files as plain text through the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write # for the 👀 reaction and summary comment

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only review PRs into the default branch (main).
    if: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted reviewer (base branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Comments are posted as the "AI Review" GitHub App when it is configured,
      # otherwise as github-actions[bot].
      - name: Get AI Review app token
        id: app-token
        if: ${{ vars.AI_REVIEW_APP_ID != '' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }} # token works for this repo only

      - name: Run reviewer
        run: node .github/scripts/review.js
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REVIEW_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
